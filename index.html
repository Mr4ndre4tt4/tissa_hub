    <!--
      Sem rastreador e sem captura de sessão. Nenhum recurso externo é carregado.

      connect-src inclui *.microsoftpersonalcontent.com: é o domínio real de
      download de conteúdo do OneDrive PESSOAL (confirmado contra a conta
      real — "my.microsoftpersonalcontent.com"), diferente de
      *.sharepoint.com (OneDrive/SharePoint corporativo) e *.1drv.com (links
      de compartilhamento). Sem ele, baixar uma revisão falhava com "Failed
      to fetch" — a política bloqueando antes mesmo da rede, sem nenhuma
      mensagem clara (DECISOES.md §21-22).
    -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://*.sharepoint.com https://*.up.1drv.com https://*.files.1drv.com https://*.microsoftpersonalcontent.com; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'none'; form-action 'none'" />
