# Publicação da interface no GitHub Pages, pelo branch `gh-pages`.
#
# Por que este caminho e não a publicação por "GitHub Actions": o GITHUB_TOKEN
# não tem permissão para criar o site do Pages ("Resource not accessible by
# integration"), e a habilitação manual não funcionou neste repositório.
# Publicando num branch, o GitHub habilita o Pages sozinho e o workflow só
# precisa de `contents: write` — nenhuma permissão especial, nenhuma
# configuração manual.
#
# Vão ao ar apenas código e recursos públicos (secção 14.1). Os dados de
# trabalho continuam no OneDrive pessoal e exigem autenticação Microsoft: a
# página ser pública não expõe nenhum chamado.
#
# A configuração pública vem de **variáveis do repositório**, não do código.
# Elas não são segredos, mas também não são inventadas: enquanto estiverem
# vazias, o aplicativo publicado exibe "Integração Microsoft não configurada" e
# oferece apenas o modo demonstrativo.
#
# Definir em: Settings → Secrets and variables → Actions → Variables
#   MS_CLIENT_ID     client ID do registro de aplicativo Microsoft
#   MS_AUTHORITY     opcional; padrão é a autoridade de consumidores
#   MS_REDIRECT_URI  opcional; padrão é o próprio endereço publicado
#   APP_URL          opcional; padrão é o próprio endereço publicado

name: Publicar interface

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Publicação só acontece com tipagem limpa e testes passando.
      - name: Tipagem
        run: npx tsc -b

      - name: Testes
        run: npm test

      - name: Definir endereço e caminho base
        id: destino
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          dono="${GITHUB_REPOSITORY%/*}"
          dono_minusculo=$(echo "$dono" | tr '[:upper:]' '[:lower:]')
          echo "base=/$repo/" >> "$GITHUB_OUTPUT"
          echo "url=https://$dono_minusculo.github.io/$repo/" >> "$GITHUB_OUTPUT"

      - name: Construir
        env:
          VITE_BASE: ${{ steps.destino.outputs.base }}
          VITE_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
          VITE_MS_AUTHORITY: ${{ vars.MS_AUTHORITY || 'https://login.microsoftonline.com/consumers' }}
          VITE_MS_REDIRECT_URI: ${{ vars.MS_REDIRECT_URI || steps.destino.outputs.url }}
          VITE_APP_URL: ${{ vars.APP_URL || steps.destino.outputs.url }}
        run: npm run build

      - name: Conferir o build
        env:
          BASE: ${{ steps.destino.outputs.base }}
        run: |
          set -e
          # Caminho base errado quebra todos os assets em silêncio.
          if ! grep -q "src=\"${BASE}assets/" dist/index.html; then
            echo "FALHA: o index.html não referencia os assets em ${BASE}assets/."
            grep -oE '(src|href)="[^"]*assets[^"]*"' dist/index.html || true
            exit 1
          fi
          echo "Caminho base correto: ${BASE}"

          # Nenhum insumo privado pode entrar no que vai ao ar (AC-059).
          if find dist -type f \( -name '*.xlsm' -o -name '*.xlsx' -o -name '*.csv' \) | grep -q .; then
            echo "FALHA: o build contém um arquivo de planilha."; exit 1
          fi
          if grep -rlE '\b(IR3[0-9]{7}|RR2[0-9]{7}|INC3[0-9]{6}|SCTASK1[0-9]{6})\b' dist/ >/dev/null 2>&1; then
            echo "FALHA: o build contém identificador de chamado fora da faixa sintética."; exit 1
          fi
          if grep -rlE '7aa0e9a0399944ed|382ef4e1c171c5fe|c734299eb47b9b6e' dist/ >/dev/null 2>&1; then
            echo "FALHA: o build contém hash de insumo privado."; exit 1
          fi
          echo "Build sem dados reais."

      - name: Publicar no branch gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Impede que o Jekyll ignore arquivos do build.
          touch dist/.nojekyll

          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica a interface a partir de ${GITHUB_SHA::7}"
          # Branch de publicação é sempre substituído: guarda o site, não histórico.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Endereço publicado
        run: |
          echo "### Interface publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.destino.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${{ vars.MS_CLIENT_ID }}" ]; then
            echo "A variável \`MS_CLIENT_ID\` não está definida: o aplicativo sobe em **modo demonstrativo** e não grava nada." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Integração Microsoft configurada. A prova técnica da secção 16.5 continua sendo pré-requisito para uso com dados reais." >> "$GITHUB_STEP_SUMMARY"
          fi
